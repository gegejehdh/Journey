<style>
:root{--red:#c8102e;--navy:#14284b;--ink:#1b1b1f;--mut:#6b6b73;--bg:#fff;--line:#e6e6ea}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Inter,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.25;margin:0 0 .4em}
.w{max-width:1160px;margin:auto;padding:0 16px}
header{border-bottom:3px solid var(--red);position:sticky;top:0;background:#fff;z-index:9}
.top{display:flex;align-items:center;gap:12px;padding:10px 0}.top img{width:46px;height:46px;border-radius:8px}
.brand b{font:800 20px 'Playfair Display';letter-spacing:.5px}.brand small{display:block;color:var(--mut);font-size:11px}
.sp{flex:1}.soc a{margin-left:10px;font-size:13px;color:var(--mut)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav>a,nav .dd>a{padding:10px 12px;font-size:14px;font-weight:500;white-space:nowrap;display:block}
nav a:hover{color:var(--red)}.dd{position:relative}.dd div{display:none;position:absolute;background:#fff;border:1px solid var(--line);min-width:180px;box-shadow:0 8px 20px #0002;z-index:5}
.dd:hover div{display:block}.dd div a{display:block;padding:9px 14px;font-size:14px}
.tick{background:var(--red);color:#fff;display:flex;overflow:hidden;font-size:14px}.tick b{background:#000;padding:6px 14px;white-space:nowrap;z-index:1}
.tick div{display:flex;gap:48px;white-space:nowrap;padding:6px 0;animation:mq 40s linear infinite}@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;margin:24px 0}
.hl{position:relative;min-height:420px;background:#222 center/cover;color:#fff;display:flex;align-items:flex-end;border-radius:4px;overflow:hidden}
.hl:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#000d)}.hl div{position:relative;padding:24px}
.hl h1{font-size:clamp(24px,4vw,38px)}.btn{display:inline-block;background:var(--red);color:#fff;padding:9px 18px;border:0;border-radius:3px;font:500 14px Inter;cursor:pointer}
.sec{display:flex;align-items:center;gap:12px;margin:34px 0 14px;border-bottom:2px solid var(--ink)}.sec h2{margin:0;font-size:22px;border-bottom:4px solid var(--red);margin-bottom:-2px;padding-bottom:4px}
.sec a{margin-left:auto;color:var(--red);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{display:block;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.im{aspect-ratio:16/10;background:#ddd center/cover;border-radius:3px;margin-bottom:10px;transition:.3s}.card:hover .im{filter:brightness(.9)}
.tag{color:var(--red);font:700 12px Inter;text-transform:uppercase;letter-spacing:.6px}.card h3{font-size:18px;margin:.2em 0}
.card p{color:var(--mut);font-size:14px;margin:.2em 0}small{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips a{border:1px solid var(--line);padding:6px 14px;border-radius:20px;font-size:14px}.chips a:hover{background:var(--red);color:#fff}
.two{display:grid;grid-template-columns:2fr 1fr;gap:30px}.pop a{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.pop i{font:800 26px 'Playfair Display';color:var(--red);font-style:normal}
.art{max-width:760px;margin:30px auto}.art h1{font-size:clamp(28px,5vw,42px)}.art img,.art iframe{max-width:100%}.art iframe{width:100%;aspect-ratio:16/9;border:0}
.art .body{font-size:18px;line-height:1.8}.art blockquote{border-left:4px solid var(--red);margin:20px 0;padding:4px 18px;color:var(--mut);font-style:italic}
.art figure{margin:18px 0}.art figcaption{font-size:13px;color:var(--mut)}
.sh a{display:inline-block;margin-right:8px;padding:6px 12px;background:var(--navy);color:#fff;border-radius:3px;font-size:13px}.sh a:first-child{background:#25d366}
.sk{background:linear-gradient(90deg,#eee,#f7f7f7,#eee);background-size:200%;animation:sk 1.2s infinite;border-radius:4px;height:200px;margin:20px 0}@keyframes sk{to{background-position:-200% 0}}
.fil{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}input,select{padding:9px 12px;border:1px solid var(--line);border-radius:3px;font:inherit}
.gal{columns:3 220px;gap:14px}.gal figure{margin:0 0 14px;break-inside:avoid}.gal img,.gal video{width:100%;border-radius:3px}
.empty{text-align:center;color:var(--mut);padding:60px 0}
footer{background:#111;color:#bbb;margin-top:60px;padding:36px 0 14px;font-size:14px}footer .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}footer h4{color:#fff;margin:0 0 8px}footer a{display:block}

firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),$=s=>document.querySelector(s);
let S={},posts=[],cats=[],gal=[],loaded=false,N=9,unsub;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>t&&t.toDate?t.toDate().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
const SUB=['Berita Sekolah','Kegiatan Siswa','Prestasi','Informasi','Lingkungan Sekolah'];
$('#sub').innerHTML=SUB.map(c=>`<a href="#/k/${c}">${c}</a>`).join('');$('#yr').textContent=new Date().getFullYear();
function listen(){unsub&&unsub();unsub=db.collection('posts').where('status','==','published').where('publishAt','<=',new Date()).orderBy('publishAt','desc').limit(200)
 .onSnapshot(s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render()},e=>{loaded=true;console.error(e);render()})}
listen();setInterval(listen,300000);
db.doc('settings/site').onSnapshot(d=>{S=d.data()||{};brand();render()});
db.collection('categories').orderBy('name').onSnapshot(s=>{cats=s.docs.map(d=>d.data().name);render()});
db.collection('gallery').orderBy('date','desc').onSnapshot(s=>{gal=s.docs.map(d=>({id:d.id,...d.data()}));render()});
if(!sessionStorage.v){sessionStorage.v=1;db.doc('stats/visits').set({count:firebase.firestore.FieldValue.increment(1)},{merge:true}).catch(()=>{})}
function brand(){const so=S.social||{};if(S.name){$('#nm').textContent=S.name;$('#fn').textContent=S.name}if(S.logo)$('#lg').src=S.logo;
 if(S.color)document.documentElement.style.setProperty('--red',S.color);
 const l=Object.entries(so).filter(x=>x[1]).map(([k,v])=>`<a href="${esc(v)}" target="_blank" rel="noopener">${k}</a>`).join('');$('#soc').innerHTML=l;$('#fs').innerHTML=l;
 $('#fd').textContent=S.desc||'Portal berita dan media informasi sekolah.';$('#ft').textContent=S.footer||'';
 $('#fk').innerHTML=[S.email,S.phone,S.address].filter(Boolean).map(esc).join('<br>')}
const card=p=>`<a class="card" href="#/p/${p.slug}"><div class="im" style="background-image:url('${esc(p.image)}')"></div><span class="tag">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><small>${fd(p.publishAt)}${p.views?' · '+p.views+' dibaca':''}</small></a>`;
const sec=(t,l)=>`<div class="sec"><h2>${t}</h2>${l?`<a href="${l}">Lihat Semua →</a>`:''}</div>`;
const grid=a=>a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">Belum ada berita.</div>';
const galH=a=>`<div class="gal">${a.map(g=>`<figure>${g.kind=='video'?(/youtu/.test(g.url)?`<iframe src="${esc(g.url.replace('watch?v=','embed/'))}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`:`<video src="${esc(g.url)}" controls></video>`):`<img loading="lazy" src="${esc(g.url)}">`}<figcaption><b>${esc(g.title)}</b> <small>${esc(g.album||'')} · ${fd(g.date)}</small><br><small>${esc(g.desc||'')}</small></figcaption></figure>`).join('')}</div>`;
function meta(t,d,i){document.title=t;[['description',d],['og:title',t],['og:description',d],['og:image',i]].forEach(([k,v])=>{let e=document.querySelector(`meta[name="${k}"],meta[property="${k}"]`);if(!e){e=document.createElement('meta');e.setAttribute(k.startsWith('og')?'property':'name',k);document.head.appendChild(e)}e.content=v||''})}
function render(){const m=$('#m');if(!loaded){m.innerHTML='<div class="sk"></div><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';return}
 const [r,a]=location.hash.slice(2).split('/').map(decodeURIComponent);meta('Journey Inspera — Pers Sekolah',S.desc);
 const br=posts.filter(p=>p.breaking);$('#tk').innerHTML=br.length&&!r?`<div class="tick"><b>BREAKING</b><div>${br.map(p=>`<a href="#/p/${p.slug}">${esc(p.title)}</a>`).join('')}</div></div>`:'';
 if(!r){const h=posts.find(p=>p.headline)||posts[0];if(!h){m.innerHTML='<div class="empty">Belum ada berita diterbitkan.</div>';return}
  const rest=posts.filter(p=>p!==h),pop=[...posts].sort((x,y)=>(y.views||0)-(x.views||0)).slice(0,5),pk=posts.filter(p=>p.pick).slice(0,3),op=posts.filter(p=>['Opini','Artikel'].includes(p.category)).slice(0,3);
  m.innerHTML=`<div class="hero"><a class="hl" href="#/p/${h.slug}" style="background-image:url('${esc(h.image)}')"><div><span class="tag" style="color:#fff;background:var(--red);padding:2px 8px">${esc(h.category)}</span><h1>${esc(h.title)}</h1><p>${esc(h.summary)}</p><small style="color:#ddd">${fd(h.publishAt)}</small><br><span class="btn">Baca Selengkapnya</span></div></a><div>${rest.slice(0,3).map(card).join('')}</div></div>
  ${sec('Berita Terbaru','#/berita')}${grid(rest.slice(0,N))}<p style="text-align:center"><a class="btn" href="#/berita">Lihat Semua Berita</a></p>
  ${sec('Kategori')}<div class="chips">${(cats.length?cats:[...SUB,'Pendidikan','Organisasi','Opini']).map(c=>`<a href="#/k/${encodeURIComponent(c)}">${esc(c)}</a>`).join('')}</div>
  <div class="two"><div>${pk.length?sec('Pilihan Redaksi')+grid(pk):''}${op.length?sec('Artikel & Opini','#/k/Opini')+grid(op):''}</div><div class="pop">${sec('Berita Populer')}${pop.map((p,i)=>`<a href="#/p/${p.slug}"><i>${i+1}</i><span>${esc(p.title)}<br><small>${p.views||0} tayangan</small></span></a>`).join('')}</div></div>
  ${gal.length?sec('Galeri Dokumentasi','#/galeri')+galH(gal.slice(0,6)):''}`;return}
 if(r=='berita'||r=='k'){const l=r=='k'?posts.filter(p=>p.category==a):posts;m.innerHTML=sec(r=='k'?esc(a):'Semua Berita')+grid(l.slice(0,N))+(l.length>N?'<p style="text-align:center"><button class="btn" onclick="N+=9;render()">Muat lebih banyak</button></p>':'');return}
 if(r=='p'){const p=posts.find(x=>x.slug==a);if(!p){m.innerHTML='<div class="empty"><h1>404</h1>Berita tidak ditemukan atau belum diterbitkan.<br><a class="btn" href="#/">Ke Beranda</a></div>';return}
  meta(p.title+' — Journey Inspera',p.summary,p.image);const u=encodeURIComponent(location.href);
  if(!sessionStorage['v'+p.id]){sessionStorage['v'+p.id]=1;db.collection('posts').doc(p.id).update({views:(p.views||0)+1}).catch(()=>{})}
  const rel=posts.filter(x=>x!==p&&x.category==p.category).slice(0,3),more=posts.filter(x=>x!==p).slice(0,3);
  m.innerHTML=`<article class="art"><span class="tag">${esc(p.category)}</span><h1>${esc(p.title)}</h1><p style="font-size:19px;color:var(--mut)">${esc(p.summary)}</p><small>Oleh <b>${esc(p.author)}</b>${p.editor?' · Editor: '+esc(p.editor):''} · ${p.publishAt.toDate().toLocaleString('id-ID')}</small>
  ${p.image?`<figure><img src="${esc(p.image)}"><figcaption>${esc(p.caption)}</figcaption></figure>`:''}<div class="body">${p.content}</div>
  <p>${(p.tags||[]).map(t=>`<a class="tag" href="#/cari/${encodeURIComponent(t)}">#${esc(t)}</a> `).join('')}</p>
  <p class="sh"><a href="https://wa.me/?text=${encodeURIComponent(p.title)}%20${u}" target="_blank">WhatsApp</a><a href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank">Facebook</a><a href="https://twitter.com/intent/tweet?url=${u}" target="_blank">X</a></p></article>
  ${rel.length?sec('Berita Terkait')+grid(rel):''}${sec('Rekomendasi')+grid(more)}`;scrollTo(0,0);return}
 if(r=='cari'){m.innerHTML=`${sec('Cari Berita')}<div class="fil"><input id="q" placeholder="Kata kunci…" value="${esc(a||'')}" style="flex:1"><select id="fc"><option value="">Semua kategori</option>${[...new Set([...cats,...posts.map(p=>p.category)])].map(c=>`<option>${esc(c)}</option>`).join('')}</select><input type="date" id="fdt"><select id="fs2"><option value="n">Terbaru</option><option value="p">Terpopuler</option></select></div><div id="rs"></div>`;
  const go=()=>{let q=$('#q').value.toLowerCase(),c=$('#fc').value,d=$('#fdt').value,l=posts.filter(p=>(!q||(p.title+p.summary+(p.tags||[]).join(' ')).toLowerCase().includes(q))&&(!c||p.category==c)&&(!d||p.publishAt.toDate().toISOString().slice(0,10)==d));
   if($('#fs2').value=='p')l.sort((x,y)=>(y.views||0)-(x.views||0));$('#rs').innerHTML=grid(l)};document.querySelectorAll('.fil>*').forEach(e=>e.oninput=go);go();return}
 if(r=='galeri'){m.innerHTML=sec('Galeri Dokumentasi')+(gal.length?galH(gal):'<div class="empty">Belum ada dokumentasi.</div>');return}
 if(r=='tentang'){const t=S.about||{};m.innerHTML=`<div class="art"><h1>Tentang Kami</h1>${[['Sejarah',t.history],['Profil',t.profile],['Visi',t.vision],['Misi',t.mission],['Tujuan',t.goals],['Prinsip Jurnalistik',t.principles],['Struktur Kepengurusan',t.structure]].map(([k,v])=>v?`<h2>${k}</h2><p style="white-space:pre-line">${esc(v)}</p>`:'').join('')}</div>`;return}
 if(r=='kontak'){m.innerHTML=`<div class="art"><h1>Kontak</h1><p>${[S.email,S.phone,S.address].filter(Boolean).map(esc).join('<br>')||'Belum diatur.'}</p></div>`;return}
 m.innerHTML='<div class="empty"><h1>404</h1>Halaman tidak ditemukan.</div>'}
addEventListener('hashchange',()=>{N=9;render()});
</script></body></html>
