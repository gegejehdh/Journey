<style>
:root{--red:#c8102e;--navy:#14284b;--line:#e3e3e8;--bg:#f4f5f8}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:#1b1b1f}
#lg{max-width:360px;margin:12vh auto;background:#fff;padding:28px;border-radius:8px;box-shadow:0 4px 24px #0002;text-align:center}#lg img{width:90px;border-radius:12px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff;margin:3px 0 10px}textarea{min-height:80px}
button,.b{background:var(--red);color:#fff;border:0;padding:8px 14px;border-radius:5px;cursor:pointer;font:inherit}.b2{background:#555}.bd{background:#222}
#app{display:none;min-height:100vh}aside{background:var(--navy);color:#fff;width:210px;position:fixed;inset:0 auto 0 0;padding:14px;overflow:auto;transition:.2s;z-index:5}
aside img{width:48px;border-radius:8px}aside a{display:block;padding:9px 10px;border-radius:5px;color:#dde;cursor:pointer}aside a.on,aside a:hover{background:var(--red);color:#fff}
main{margin-left:210px;padding:20px;max-width:1100px}.bar{display:none}.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.st div{background:#fff;padding:14px;border-radius:8px;border-left:4px solid var(--red)}.st b{font-size:26px;display:block}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.sc{overflow-x:auto}
.pill{padding:2px 8px;border-radius:10px;font-size:12px;background:#ddd}.pub{background:#c9f0d3}.sch{background:#ffe6b0}
#ed{min-height:300px;border:1px solid var(--line);background:#fff;padding:12px;border-radius:0 0 5px 5px}#tb{background:#eee;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:5px 5px 0 0;display:flex;gap:4px;flex-wrap:wrap}#tb button{background:#fff;color:#000;border:1px solid #ccc;padding:4px 9px}
.ck{display:flex;gap:16px;flex-wrap:wrap}.ck label{display:flex;gap:6px;align-items:center}.ck input{width:auto;margin:0}
.bar2{height:14px;background:var(--red);border-radius:3px}#ts{position:fixed;right:16px;bottom:16px;z-index:99}#ts div{background:#222;color:#fff;padding:10px 16px;border-radius:6px;margin-top:8px}#ts .err{background:#b00020}

<script>
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),st=firebase.storage(),TS=firebase.firestore.Timestamp,$=s=>document.querySelector(s);
let me,role,P=[],G=[],C=[],U=[],SET={},ACT=[],VIS=0,cur={},view='dash';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=(t,e)=>{const d=document.createElement('div');d.textContent=t;if(e)d.className='err';$('#ts').appendChild(d);setTimeout(()=>d.remove(),3500)};
const fd=t=>t&&t.toDate?t.toDate().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'';
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,6);
const log=t=>db.collection('activity').add({text:t,user:me.name||me.email,at:TS.now()}).catch(()=>{});
const up=async(f,file)=>{const r=st.ref(f+'/'+Date.now()+'_'+file.name.replace(/\W+/g,'_'));await r.put(file);return r.getDownloadURL()};
const isMgr=()=>['superadmin','admin'].includes(role),canPub=()=>role!='reporter';
$('#lf').onsubmit=e=>{e.preventDefault();auth.signInWithEmailAndPassword($('#em').value,$('#pw').value).catch(()=>toast('Email atau password salah','err'))};
auth.onAuthStateChanged(async u=>{if(!u){$('#app').style.display='none';$('#lg').style.display='block';return}
 const d=await db.collection('users').doc(u.uid).get();if(!d.exists){toast('Akun belum terdaftar sebagai pengurus','err');auth.signOut();return}
 me={uid:u.uid,email:u.email,...d.data()};role=me.role;$('#lg').style.display='none';$('#app').style.display='block';$('#who').innerHTML=esc(me.name||me.email)+'<br><small>'+role+'</small>';start()});
function start(){const q=role=='reporter'?db.collection('posts').where('uid','==',me.uid):db.collection('posts').orderBy('createdAt','desc');
 q.onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));if(['dash','posts','stats'].includes(view))go(view,1)},e=>toast(e.message,'err'));
 db.collection('gallery').orderBy('date','desc').onSnapshot(s=>{G=s.docs.map(d=>({id:d.id,...d.data()}));if(view=='gal')go('gal',1)});
 db.collection('categories').orderBy('name').onSnapshot(s=>{C=s.docs.map(d=>({id:d.id,...d.data()}));if(view=='cats')go('cats',1)});
 db.doc('settings/site').onSnapshot(d=>{SET=d.data()||{}});
 if(isMgr()){db.collection('users').onSnapshot(s=>{U=s.docs.map(d=>({id:d.id,...d.data()}));if(view=='users')go('users',1)});
  db.collection('activity').orderBy('at','desc').limit(15).onSnapshot(s=>{ACT=s.docs.map(d=>d.data());if(view=='dash')go('dash',1)});
  db.doc('stats/visits').onSnapshot(d=>{VIS=d.exists?d.data().count:0})}
 go('dash')}
const NAV=[['dash','📊 Dashboard'],['posts','📰 Berita & Artikel'],['gal','🖼 Galeri',1],['cats','🏷 Kategori',2],['pages','📄 Halaman',2],['users','👥 Pengurus',3],['set','⚙ Pengaturan',2],['stats','📈 Statistik',2]];
function go(v,keep){view=v;if(!keep)cur={};$('#nv').innerHTML=NAV.filter(n=>!n[2]||(n[2]==1&&role!='reporter')||(n[2]==2&&isMgr())||(n[2]==3&&role=='superadmin')).map(n=>`<a class="${n[0]==v?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
 document.querySelector('aside').classList.remove('o');V[v]()}
const pc=p=>p.status=='published'?(p.publishAt.toMillis()>Date.now()?'sch':'pub'):'',pl=p=>p.status=='published'?(p.publishAt.toMillis()>Date.now()?'Terjadwal':'Terbit'):'Draft';
const V={
dash(){const pub=P.filter(p=>pl(p)=='Terbit'),top=[...P].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5);
 $('#mn').innerHTML=`<h2>Dashboard</h2><div class="st"><div><b>${P.length}</b>Total berita</div><div><b>${pub.length}</b>Diterbitkan</div><div><b>${P.filter(p=>p.status=='draft').length}</b>Draft</div><div><b>${P.filter(p=>pl(p)=='Terjadwal').length}</b>Terjadwal</div><div><b>${P.filter(p=>['Artikel','Opini'].includes(p.category)).length}</b>Artikel/Opini</div><div><b>${G.length}</b>Dokumentasi</div><div><b>${VIS}</b>Pengunjung</div></div>
 <div class="card"><h3>Paling banyak dibaca</h3>${top.map(p=>`<div>${esc(p.title)} — <b>${p.views||0}</b></div>`).join('')||'-'}</div>
 ${isMgr()?`<div class="card"><h3>Aktivitas terbaru</h3>${ACT.map(a=>`<div><small>${fd(a.at)}</small> <b>${esc(a.user)}</b> ${esc(a.text)}</div>`).join('')||'-'}</div>`:''}`},
posts(){const f=cur.f||'';$('#mn').innerHTML=`<h2>Berita & Artikel <button onclick="edit()">+ Tulis Baru</button> <button class="b2" onclick="addSample()">Isi berita contoh</button></h2><div class="card sc"><input placeholder="Cari judul…" value="${esc(f)}" oninput="cur.f=this.value;V.posts()" autofocus><table><tr><th>Judul</th><th>Kategori</th><th>Status</th><th>Dibaca</th><th></th></tr>
 ${P.filter(p=>p.title.toLowerCase().includes(f.toLowerCase())).map(p=>`<tr><td>${esc(p.title)}<br><small>${esc(p.author)} · ${fd(p.publishAt)}</small></td><td>${esc(p.category)}</td><td><span class="pill ${pc(p)}">${pl(p)}</span></td><td>${p.views||0}</td><td style="white-space:nowrap"><button onclick="edit('${p.id}')">Edit</button> ${p.status=='published'&&canPub()?`<button class="b2" onclick="unpub('${p.id}')">Batalkan</button>`:''} ${(isMgr()||(role=='reporter'&&p.status=='draft'))?`<button class="bd" onclick="del('${p.id}')">Hapus</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>Belum ada berita.</td></tr>'}</table></div>`;},
gal(){$('#mn').innerHTML=`<h2>Galeri</h2><div class="card"><input id="gt" placeholder="Judul"><textarea id="gd" placeholder="Deskripsi"></textarea><input id="ga" placeholder="Album / kegiatan"><input id="gdt" type="date"><select id="gk"><option value="photo">Foto</option><option value="video">Video (upload)</option><option value="yt">Video (tautan YouTube)</option></select><input id="gu" placeholder="Tautan YouTube (jika video tautan)"><input id="gf" type="file" accept="image/*,video/*"><button onclick="addGal()">Simpan</button></div>
 <div class="card sc"><table>${G.map(g=>`<tr><td>${g.kind=='photo'?`<img src="${esc(g.url)}" width=70>`:'🎬'}</td><td><b>${esc(g.title)}</b><br><small>${esc(g.album)} · ${fd(g.date)}</small></td><td><button class="bd" onclick="delGal('${g.id}')">Hapus</button></td></tr>`).join('')||'<tr><td>Belum ada dokumentasi.</td></tr>'}</table></div>`},
cats(){$('#mn').innerHTML=`<h2>Kategori</h2><div class="card"><input id="cn" placeholder="Nama kategori"><button onclick="addCat()">Tambah</button> <button class="b2" onclick="seed()">Isi kategori awal</button></div><div class="card">${C.map(c=>`<div style="padding:6px 0">${esc(c.name)} <button onclick="renCat('${c.id}','${esc(c.name)}')">Ubah</button> <button class="bd" onclick="delCat('${c.id}')">Hapus</button></div>`).join('')||'Belum ada kategori.'}</div>`},
pages(){const a=SET.about||{},f=(k,l)=>`<label>${l}</label><textarea id="ab_${k}">${esc(a[k])}</textarea>`;$('#mn').innerHTML=`<h2>Halaman</h2><div class="card">${f('history','Sejarah')}${f('profile','Profil organisasi')}${f('vision','Visi')}${f('mission','Misi')}${f('goals','Tujuan')}${f('principles','Prinsip jurnalistik')}${f('structure','Struktur kepengurusan (satu baris per orang)')}<button onclick="savePages()">Simpan</button></div>`},
users(){$('#mn').innerHTML=`<h2>Pengurus & Penulis</h2><div class="card"><input id="un" placeholder="Nama"><input id="ue" type="email" placeholder="Email"><input id="up" type="password" placeholder="Password awal (min 6)"><select id="ur"><option value="reporter">Reporter</option><option value="editor">Editor</option><option value="admin">Admin</option><option value="superadmin">Super Admin</option></select><button onclick="addUser()">Buat akun</button></div>
 <div class="card sc"><table>${U.map(u=>`<tr><td>${esc(u.name)}<br><small>${esc(u.email)}</small></td><td><select onchange="setRole('${u.id}',this.value)">${['reporter','editor','admin','superadmin'].map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select></td><td><button class="bd" onclick="delUser('${u.id}')">Cabut akses</button></td></tr>`).join('')}</table></div>`},
set(){const s=SET.social||{},i=(k,l,v)=>`<label>${l}</label><input id="s_${k}" value="${esc(v)}">`;$('#mn').innerHTML=`<h2>Pengaturan Website</h2><div class="card">${i('name','Nama website',SET.name)}${i('desc','Deskripsi',SET.desc)}${i('color','Warna identitas (hex)',SET.color||'#c8102e')}${i('banner','Banner / teks headline',SET.banner)}${i('email','Email',SET.email)}${i('phone','Telepon',SET.phone)}${i('address','Alamat',SET.address)}${i('footer','Teks footer',SET.footer)}${['instagram','facebook','youtube','tiktok'].map(k=>i('so_'+k,k,s[k])).join('')}<label>Logo baru</label><input id="s_logo" type="file" accept="image/*"><button onclick="saveSet()">Simpan</button></div>`},
stats(){const bc={},bm={};P.filter(p=>p.status=='published').forEach(p=>{bc[p.category]=(bc[p.category]||0)+1;const k=p.publishAt.toDate().toISOString().slice(0,7);bm[k]=(bm[k]||0)+1});
 const bar=(o)=>{const mx=Math.max(1,...Object.values(o));return Object.entries(o).sort().map(([k,v])=>`<div>${esc(k)} (${v})<div class="bar2" style="width:${v/mx*100}%"></div></div>`).join('')||'-'};
 $('#mn').innerHTML=`<h2>Statistik</h2><div class="st"><div><b>${VIS}</b>Pengunjung</div><div><b>${P.reduce((a,p)=>a+(p.views||0),0)}</b>Total pembaca</div></div><div class="card"><h3>Publikasi per kategori</h3>${bar(bc)}</div><div class="card"><h3>Perkembangan per bulan</h3>${bar(bm)}</div><div class="card"><h3>Pembaca per berita</h3>${[...P].sort((a,b)=>(b.views||0)-(a.views||0)).map(p=>`<div>${esc(p.title)} — <b>${p.views||0}</b></div>`).join('')}</div>`}};
// ---- Editor berita
function edit(id){cur.id=id;const p=P.find(x=>x.id==id)||{};cur.image=p.image;const cl=[...new Set([...C.map(c=>c.name),p.category].filter(Boolean))];
 const when=p.publishAt?new Date(p.publishAt.toMillis()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 $('#mn').innerHTML=`<h2>${id?'Edit':'Tulis'} Berita</h2><div class="card"><label>Judul</label><input id="t" value="${esc(p.title)}"><label>Subjudul / ringkasan</label><textarea id="s">${esc(p.summary)}</textarea>
 <label>Kategori</label><select id="c">${cl.map(c=>`<option ${c==p.category?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Tag (pisahkan koma)</label><input id="tg" value="${esc((p.tags||[]).join(', '))}">
 <label>Penulis</label><input id="a" value="${esc(p.author||me.name||'')}"><label>Editor</label><input id="e" value="${esc(p.editor)}">
 <label>Foto utama</label>${p.image?`<img src="${esc(p.image)}" width=160><br>`:''}<input id="img" type="file" accept="image/*"><label>Keterangan foto</label><input id="cp" value="${esc(p.caption)}">
 <label>Isi berita</label><div id="tb">${[['bold','B'],['italic','I'],['formatBlock:H2','H2'],['formatBlock:P','¶'],['insertUnorderedList','• List'],['insertOrderedList','1. List'],['formatBlock:BLOCKQUOTE','❝']].map(([c,l])=>`<button type="button" onmousedown="event.preventDefault();fmt('${c}')">${l}</button>`).join('')}<button type="button" onmousedown="event.preventDefault();lnk()">🔗</button><button type="button" onmousedown="event.preventDefault();$('#pi').click()">🖼</button><button type="button" onmousedown="event.preventDefault();vid()">▶</button></div><input id="pi" type="file" accept="image/*" hidden onchange="pimg(this)"><div id="ed" contenteditable>${p.content||'<p><br></p>'}</div>
 <div class="ck"><label><input type="checkbox" id="hl" ${p.headline?'checked':''}>Headline</label><label><input type="checkbox" id="bk" ${p.breaking?'checked':''}>Breaking news</label><label><input type="checkbox" id="pk" ${p.pick?'checked':''}>Pilihan redaksi</label></div>
 ${canPub()?`<label>Jadwal terbit (kosongkan = sekarang)</label><input id="when" type="datetime-local" value="${when}">`:'<input id="when" hidden>'}
 <button onclick="savePost(0)" class="b2">Simpan Draft</button> ${canPub()?'<button onclick="savePost(1)">Terbitkan / Jadwalkan</button>':''} <button class="bd" onclick="go('posts')">Batal</button></div>`}
const fmt=c=>{const [a,b]=c.split(':');document.execCommand(a,false,b)};
const lnk=()=>{const u=prompt('URL tautan:');u&&document.execCommand('createLink',false,u)};
const vid=()=>{const u=prompt('URL video YouTube:');if(!u)return;const m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);if(!m)return toast('URL YouTube tidak valid','err');document.execCommand('insertHTML',false,`<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe><p><br></p>`)};
async function pimg(i){if(!i.files[0])return;try{const u=await up('posts',i.files[0]);$('#ed').focus();document.execCommand('insertImage',false,u)}catch(e){toast(e.message,'err')}}
async function savePost(pub){const v=i=>$('#'+i).value;if(!v('t').trim())return toast('Judul wajib diisi','err');if(pub&&!v('s').trim())return toast('Ringkasan wajib diisi','err');
 try{let img=cur.image||'';const f=$('#img').files[0];if(f)img=await up('posts',f);const when=v('when')?new Date(v('when')):new Date();
 const d={title:v('t').trim(),summary:v('s'),content:$('#ed').innerHTML,category:v('c'),tags:v('tg').split(',').map(x=>x.trim()).filter(Boolean),author:v('a'),editor:v('e'),image:img,caption:v('cp'),status:pub&&canPub()?'published':'draft',publishAt:TS.fromDate(when),headline:$('#hl').checked,breaking:$('#bk').checked,pick:$('#pk').checked,updatedAt:TS.now()};
 if(cur.id)await db.collection('posts').doc(cur.id).update(d);else await db.collection('posts').add({...d,slug:slug(d.title),views:0,uid:me.uid,createdAt:TS.now()});
 log((d.status=='published'?'menerbitkan: ':'menyimpan draft: ')+d.title);toast(d.status=='published'?'Berita berhasil diterbitkan':'Draft tersimpan');go('posts')}catch(e){toast(e.message,'err')}}
async function addSample(){if(!confirm('Tambahkan satu berita contoh dan langsung terbitkan?'))return;try{
 const svg="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14284b"/><stop offset="1" stop-color="#c8102e"/></linearGradient></defs><rect width="1200" height="750" fill="url(#g)"/><text x="600" y="390" font-size="72" fill="#fff" text-anchor="middle" font-family="Georgia">JOURNEY INSPERA</text></svg>');
 const now=TS.now(),t='Journey Inspera Resmi Meluncurkan Portal Berita Sekolah';
 await db.collection('posts').add({title:t,slug:slug(t),summary:'Pers Journey Inspera kini hadir dalam bentuk portal digital untuk menyajikan kabar, prestasi, dan kegiatan sekolah secara cepat dan terpercaya.',
 content:'<p>Pers Journey Inspera secara resmi meluncurkan portal berita digital sebagai wadah informasi dan dokumentasi seluruh kegiatan sekolah. Portal ini dapat diakses siapa saja tanpa perlu masuk akun.</p><p>Melalui portal ini, siswa, guru, dan orang tua dapat mengikuti berita sekolah, prestasi siswa, kegiatan organisasi, serta opini dan artikel yang ditulis langsung oleh pengurus pers.</p><blockquote>Kami ingin setiap cerita dari sekolah punya tempat untuk dibaca dan dikenang.</blockquote><p>Seluruh berita dikelola melalui dashboard admin sehingga setiap publikasi langsung tampil di situs publik secara otomatis.</p>',
 category:'Berita Sekolah',tags:['journey inspera','pers sekolah','peluncuran'],author:me.name||me.email,editor:'',image:svg,caption:'Ilustrasi peluncuran portal Journey Inspera',
 status:'published',publishAt:now,headline:true,breaking:true,pick:true,views:0,uid:me.uid,createdAt:now,updatedAt:now});
 log('menerbitkan berita contoh');toast('Berita contoh diterbitkan — cek situs publik')}catch(e){toast(e.message,'err')}}
async function unpub(id){if(!confirm('Batalkan publikasi? Berita tidak lagi tampil di website publik.'))return;await db.collection('posts').doc(id).update({status:'draft'});log('membatalkan publikasi');toast('Publikasi dibatalkan')}
async function del(id){if(!confirm('Hapus berita ini secara permanen?'))return;try{await db.collection('posts').doc(id).delete();log('menghapus berita');toast('Berita dihapus')}catch(e){toast(e.message,'err')}}
// ---- Galeri
async function addGal(){const k=$('#gk').value,f=$('#gf').files[0];if(!$('#gt').value)return toast('Judul wajib','err');try{let url=$('#gu').value;if(k!='yt'){if(!f)return toast('Pilih file','err');url=await up('gallery',f)}
 await db.collection('gallery').add({title:$('#gt').value,desc:$('#gd').value,album:$('#ga').value,date:TS.fromDate($('#gdt').value?new Date($('#gdt').value):new Date()),kind:k=='photo'?'photo':'video',url,createdAt:TS.now()});log('menambah dokumentasi');toast('Dokumentasi tersimpan');go('gal')}catch(e){toast(e.message,'err')}}
const delGal=async id=>{if(confirm('Hapus dokumentasi?')){await db.collection('gallery').doc(id).delete();toast('Dihapus')}};
// ---- Kategori
const addCat=async()=>{const n=$('#cn').value.trim();if(n){await db.collection('categories').add({name:n});toast('Kategori ditambahkan')}};
const renCat=async(id,o)=>{const n=prompt('Nama baru:',o);if(n)await db.collection('categories').doc(id).update({name:n})};
const delCat=async id=>{if(confirm('Hapus kategori?'))await db.collection('categories').doc(id).delete()};
const seed=async()=>{for(const n of ['Berita Sekolah','Sekolah','Pendidikan','Kegiatan Siswa','Organisasi','Prestasi','Opini','Artikel','Wawancara','Informasi','Lingkungan Sekolah'])if(!C.find(c=>c.name==n))await db.collection('categories').add({name:n});toast('Kategori awal ditambahkan')};
// ---- Halaman & pengaturan
async function savePages(){const about={};['history','profile','vision','mission','goals','principles','structure'].forEach(k=>about[k]=$('#ab_'+k).value);await db.doc('settings/site').set({about},{merge:true});log('mengubah halaman');toast('Halaman tersimpan')}
async function saveSet(){try{const v=k=>$('#s_'+k).value,d={name:v('name'),desc:v('desc'),color:v('color'),banner:v('banner'),email:v('email'),phone:v('phone'),address:v('address'),footer:v('footer'),social:{}};
 ['instagram','facebook','youtube','tiktok'].forEach(k=>d.social[k]=v('so_'+k));const f=$('#s_logo').files[0];if(f)d.logo=await up('site',f);await db.doc('settings/site').set(d,{merge:true});log('mengubah pengaturan');toast('Pengaturan tersimpan')}catch(e){toast(e.message,'err')}}
// ---- Pengurus
async function addUser(){const n=$('#un').value,e=$('#ue').value,p=$('#up').value,r=$('#ur').value;if(!n||!e||p.length<6)return toast('Lengkapi data (password min 6)','err');
 const sec=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(firebaseConfig,'sec');try{const c=await sec.auth().createUserWithEmailAndPassword(e,p);await db.collection('users').doc(c.user.uid).set({name:n,email:e,role:r});await sec.auth().signOut();log('membuat akun '+e);toast('Akun dibuat')}catch(x){toast(x.message,'err')}}
const setRole=async(id,r)=>{if(id==me.uid)return toast('Tidak bisa mengubah peran sendiri','err');await db.collection('users').doc(id).update({role:r});toast('Peran diperbarui')};
const delUser=async id=>{if(id==me.uid)return toast('Tidak bisa mencabut akses sendiri','err');if(confirm('Cabut akses akun ini?')){await db.collection('users').doc(id).delete();toast('Akses dicabut')}};
</script></body></html>
